; Horizon Connect 1.0 settings. Usually nothing needs changing here:
; hosting, joining and the server list are all done in the game (pause menu, then F12 or the View button).

[online]
; 1 = the small local server starts with the game (needed for hosting and for the online features)
AutoServer=1
; the local server's port on this PC (change only if 5101 is taken)
LocalPort=5101
; 1 = check GitHub for a newer Horizon Connect at start and show it in the server list
CheckUpdates=1
; 1 = friends in your home network can also join by this PC's address (without playit)
OpenToLan=0
; written by the mod: your address for friends (after you hosted once)
HostAddress=

[servers]
; your server list (kept by the in-game menu)

[xbl]
FakeToken=1
; your player id: "auto" makes your own one at the first start (every player needs a different one).
; Your save so far is copied for the new id at the same time; the original stays as it was.
Xuid=auto
; the name others see (empty = your player name in Azimuth)
Gamertag=

[net]
ConnectivityLevel=4
FakeQos=1
FixStreams=1
RealSockets=1
FakeParty=1
FakeAssociation=1
SkipWeatherWait=1
SkipTrafficWait=1
ServerAddress=::1
ServerPort=5101
; your PC's device address in the game: "auto" makes your own one
LocalAddress=auto
; only for testing with two games on one PC: another game port for the second one (e.g. 5102)
GamePort=

[http]
OfflineIfUnreachable=0
CheckTimeout=2000

[menu]
; The key that opens the menu in the pause menu (the controller's View button always does): F1-F24, A-Z, 0-9,
; Insert, Delete, Home, End, PageUp, PageDown, 0xNN (a Windows key code) or None. Not F5-F9 with the Azimuth
; Mapper: those are its hotkeys (F6 switches its mouse pointer mode, and W/S stop working as gas/brake).
Key=F12

[input]
Script=
HideRealController=0
